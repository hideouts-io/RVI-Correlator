name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Swift build and decoder integration tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the packet decoder
        run: brew install wireshark
      - name: Show toolchain and decoder versions
        run: |
          swift --version
          tshark --version
      - name: Build the app and capture helper
        run: swift build
      - name: Run decoder and correlation integration tests
        run: swift test -j 4
